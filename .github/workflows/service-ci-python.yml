# Per-service CI pipeline for python service. One run of this workflow = one experiment cell

# what will this workflow do:
  # execute one job: "run-cell", including several steps
#   1. Receives cell inputs from the central automated pipeline (or manually from the github UI when we manually trigger the workflow)
#   2. Generates the pip.conf file using the script: automation_process/config_generator/generate_pipconf.py
#   3. Runs resolution command: inside services/python/ (or update command, based on variable C1 input)
#   4. Uploads the raw JSON output as an artifact for the central automated pipeline to download and make further classification



name: Service CI - Python

on:
  workflow_dispatch:
    inputs:
      cell_id:
        description: "Cell identifier, e.g. cell123, which is used in artifact (resolution output) filename."
        required: true
        type: string
      A:
        description: "Nexus repository type"
        required: true
        type: choice
        options: [A1a, A1b, A2, A3]
      B1:
        description: "package manager config"
        required: true
        type: choice
        options: [B1a, B1b, B1c, B1d]
      B2:
        description: "version specifier of the dependencies (only applied for internal packages)"
        required: true
        type: choice
        options: [B2a, B2b, B2c]
      C1:
        description: "CI operation type"
        required: true
        type: choice
        options: [C1a, C1b, C1c]

jobs:
  run-cell:
    # use self-hosted github actions runner to execute the job 
    runs-on: [self-hosted, thesis-runner]

    steps:
      # 1. Get the repo to the runner.
      - name: Checkout repository
        uses: actions/checkout@v7

      
      #additional step: clean up (only for development phase)
      # need to explicit clean up some files (e.g. build artifacts, installed packages etc.)
      - name: Clean the filesystem before next cell run
        working-directory: services/python
        run: |
          
          rm -f pip.conf pyproject.toml pyproject_cell.toml
          rm -rf py_dependency
          pip cache purge || true
          rm -rf py_dependency build
          echo "workspace cleaned"

      # 2. Echo the cell inputs so the workflow log shows which cell ran.
      - name: Echo cell inputs
        run: |
          echo "cell_id = ${{ inputs.cell_id }}"
          echo "A       = ${{ inputs.A }}"
          echo "B1      = ${{ inputs.B1 }}"
          echo "B2      = ${{ inputs.B2 }}"
          echo "C1      = ${{ inputs.C1 }} "

      # 3. Generate pip.conf for this cell and write it into directory services/python/
      #The generator script prints pip.conf file content on stdout, or nothing if variable B1d
      - name: Generate pip.conf
        run: |
          python3 - <<'PY'
          import sys, os
          sys.path.insert(0, "automation_process/config_generator")
          from generate_pipconf import generate_pipconf

          A  = "${{ inputs.A }}"
          B1 = "${{ inputs.B1 }}"
          nexus_url = "http://host.docker.internal:8081"

          target = "services/python/pip.conf"
          invalid_combi = "services/python/${{ inputs.cell_id }}_invalid.txt"

          try:
            pipconf_content = generate_pipconf(A, B1, nexus_url)

            if pipconf_content is None:
                if os.path.exists(target):
                    os.remove(target)
                print(f"step [generate_pip.conf] variable B1d: no pip.conf file is written in {target}.")
            else:
                with open(target, "w") as f:
                    f.write(pipconf_content)
                print(f"step [generate_pip.conf] is already written into {target}:")
                print(pipconf_content)
          except ValueError as e:
            with open(invalid_combi, "w") as file:
              file.write(f"A={A}, B1={B1} -> {e}")
            print(f"step [generate_pip.conf] {e}")
          PY

      # 4. apply B2 (version specifier): pinned / (close) ranged / unspecified
      # will use a hard-corded pyproject.toml template to change the version specifier of internal packages
      - name: Apply version specifier (B2)
        run: |
            python3 - <<'PY'
            import sys
            sys.path.insert(0, "automation_process/config_generator")
            from generate_python_version_specifier import generate_python_version_specifier

            B2 = "${{ inputs.B2 }}"
            pyproject_path = "services/python/pyproject.toml"

            generate_python_version_specifier(B2, pyproject_path)

            print(f"[generate python version specifier] the file pyproject.toml is generated in {pyproject_path}:")
            with open(pyproject_path, "r") as f:
                print(f.read())
            PY

       # 5. Apply variable C1 (CI operation type), huge block
      # C1a: run without cache (done by cleanup step), based on pyproject.toml and pip.conf  
      - name: Apply CI pipeline operation (C1a - initial install) and run resolution command
        if: inputs.C1 == 'C1a'
        working-directory: services/python
        continue-on-error: true
        env:
            PIP_CONFIG_FILE: ${{ inputs.B1 != 'B1d' && format('{0}/services/python/pip.conf', github.workspace) || '' }}
        run: |
            if [ -f "${{ inputs.cell_id }}_invalid.txt" ]; then
              echo "skip: invalid A/B1 combination"
              exit 0
            fi

            pip install --dry-run --ignore-installed \
            --report "${{ inputs.cell_id }}_install-report.json" \
            . 2>&1 | tee "${{ inputs.cell_id }}_pip_log.txt" || true


      # Phase 1: setup (actual install of version 1.0.0 to directory ./py_dependency)
      # copy the fixed pyproject.toml to the service directory to install 
      - name: Apply CI pipeline operation (C1b - package update) and run update command
        if: inputs.C1 == 'C1b'
        working-directory: services/python
        continue-on-error: true
        env:
          PIP_CONFIG_FILE: ${{ inputs.B1 != 'B1d' && format('{0}/services/python/pip.conf', github.workspace) || '' }}
        run: |
          if [ -f "${{ inputs.cell_id }}_invalid.txt" ]; then
              echo "skip: invalid A/B1 combination"
              exit 0
          fi


          mv pyproject.toml pyproject_cell.toml
          cp "${{ github.workspace }}/fixed_setup_file/fixed_pyproject.toml" pyproject.toml

          pip install --target ./py_dependency \
          --report "${{ inputs.cell_id }}_setup-install-report.json" . \
          2>&1 | tee "${{ inputs.cell_id }}_pip_setup_log.txt" || true

          # Sanity check: if initial install failed, upgrade phase is meaningless
          if [ ! -d ./py_dependency ] || [ -z "$(ls -A ./py_dependency 2>/dev/null)" ]; then
            echo "[C1b] setup phase: initial install failed: no packages in ./py_dependency. skip package upgrade phase." \
              | tee "${{ inputs.cell_id }}_pip_log.txt"
            mv pyproject_cell.toml pyproject.toml
            exit 0
          fi

          # Restore the cell's actual pyproject.toml for phase 2 (this file's version specifier is needed)
          mv pyproject_cell.toml pyproject.toml
          echo "[C1b] internal package successfully installed to ./py_dependency. now running upgrade"

          # Phase 2: DRY-RUN upgrade of internal packages
          pip install --dry-run --target ./py_dependency --upgrade \
            xueting-thesis-event-fengfu xueting-thesis-service-zhuanfa \
            --report "${{ inputs.cell_id }}_install-report.json" \
            . 2>&1 | tee "${{ inputs.cell_id }}_pip_log.txt" || true
                

      
      # C1c: pip has a experimental lockfile and has "rebuild with lockfile" since pip 26.1
      # Important change in 08.08.2026: upgrade pip from 25.1.1 to 26.2.1 -> C1c is not invalid anymore
      # two phases (similar to npm):
        # Phase 1: use pip lock to generate pylock.toml (contains service's dependencies name, version, resolved URL)
        # Phase 2: use pip install to represent "rebuild with lockfile" scenario, 
        # use --dry-run to obtain resolution output, without actually install the dependencies -> faster per-cell
      - name: Apply CI pipeline operation (C1c)
        if: inputs.C1 == 'C1c'
        working-directory: services/python
        continue-on-error: true
        env:
          PIP_CONFIG_FILE: ${{ inputs.B1 != 'B1d' && format('{0}/services/python/pip.conf', github.workspace) || '' }}
        run: |
          if [ -f "${{ inputs.cell_id }}_invalid.txt" ]; then
              echo "skip: invalid A/B1 combination"
              exit 0
          fi


          pip lock --only-deps --output "pylock.${{ inputs.cell_id }}.toml" . \
            2>&1 | tee "${{ inputs.cell_id }}_pip_setup_log.txt" || true

          # Sanity check: if initial phase failed (resolution error, no lock file generated), then rebuild with lockfile phase is meaningless
          if [ ! -s "pylock.${{ inputs.cell_id }}.toml" ]; then
            echo "[C1c] setup phase: pip lock failed, no lockfile produced. skip "rebuild with lockfile" phase." \
              | tee "${{ inputs.cell_id }}_pip_log.txt"
            exit 0
          fi

          echo "[C1c] pip lockfile generated successfully. now running "rebuild with lockfile" phase"

          pip install --dry-run --ignore-installed \
            -r "pylock.${{ inputs.cell_id }}.toml" \
            --report "${{ inputs.cell_id }}_install-report.json" \
            2>&1 | tee "${{ inputs.cell_id }}_pip_log.txt" || true



      # 7. Upload the resolution output (install-report.json + command outputs) as one artifact.
#    The central automated pipeline will download and classify it, and write one row to results.csv.
      - name: Upload raw resolution output of pip (package manager)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.cell_id }}_pip_raw
          path: |
            services/python/pip.conf
            services/python/pyproject.toml
            services/python/pylock.${{ inputs.cell_id }}.toml
            services/python/${{ inputs.cell_id }}_install-report.json
            services/python/${{ inputs.cell_id }}_pip_log.txt
            services/python/${{ inputs.cell_id }}_pip_setup_log.txt
            services/python/${{ inputs.cell_id }}_invalid.txt

          if-no-files-found: warn
          #changed from error to warn. because now some listed files (like the setup log for non-C1c cells) won't exist
          #choose "if-no-files-found: error" will fail the experiment cell (which does not involve C1c)