# Per-service CI pipeline for Node.js service. One run of this workflow = one experiment cell

# what will this workflow do:
  # execute one job: "run-cell", including 7 steps
#   1. Receives cell inputs from the central automated pipeline (or manually from the github UI when we manually trigger the workflow)
#   2. Generates the .npmrc file using the script: automation_process/config_generator/generate_npmrc.py
#   3. Runs resolution command inside services/nodejs/
#   4. Uploads the raw JSON output as an artifact for the central automated pipeline to download and make further classification



name: Service CI - Node.js

on:
  workflow_dispatch:
    inputs:
      cell_id:
        description: "Cell identifier, e.g. cell001, which is used in artifact (resolution output) filename."
        required: true
        type: string
      A:
        description: "Nexus repository type"
        required: true
        type: choice
        options: [A1a, A1b, A2, A3]
      B1:
        description: "package manager config"
        required: true
        type: choice
        options: [B1a, B1b, B1c, B1d]
      B2:
        description: "version specifier of the dependencies (only applied for internal packages)"
        required: true
        type: choice
        options: [B2a, B2b, B2c]
      C1:
        description: "CI operation type"
        required: true
        type: choice
        options: [C1a, C1b, C1c]

jobs:
  run-cell:
    # use self-hosted github actions runner to execute the job 
    runs-on: [self-hosted, thesis-runner]

    steps:
      # 1. Get the repo to the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      
      #additional step: clean up (only for development phase)
      - name: Clean the filesystem before next cell run
        working-directory: services/nodejs
        run: |
          rm -f package-lock.json
          rm -f .npmrc
          rm -rf node_modules
          npm cache clean --force
          echo "workspace cleaned"

      # 2. Echo the cell inputs so the workflow log records which cell ran.
      - name: Echo cell inputs
        run: |
          echo "cell_id = ${{ inputs.cell_id }}"
          echo "A       = ${{ inputs.A }}"
          echo "B1      = ${{ inputs.B1 }}"
          echo "B2      = ${{ inputs.B2 }}"
          echo "C1      = ${{ inputs.C1 }} "

      # 3. Generate .npmrc for this cell and write it into directory services/nodejs/
      #The generator prints .npmrc file content on stdout, or nothing if variable B1d
      - name: Generate .npmrc
        run: |
          python3 - <<'PY'
          import sys, os
          sys.path.insert(0, "automation_process/config_generator")
          from generate_npmrc import generate_npmrc

          A  = "${{ inputs.A }}"
          B1 = "${{ inputs.B1 }}"
          nexus_url = "http://host.docker.internal:8081"

          content = generate_npmrc(A, B1, nexus_url)

          target = "services/nodejs/.npmrc"
          if content is None:
              if os.path.exists(target):
                  os.remove(target)
              print(f"[generate_npmrc] variable B1d: no .npmrc file is written in {target}.")
          else:
              with open(target, "w") as f:
                  f.write(content)
              print(f"[generate_npmrc] wrote {target}:")
              print(content)
          PY

      # 4. apply B2 (version specifier): pinned / (close) ranged / unspecified
      # will directly edit services/nodejs/package.json to change the version specification of internal packages
      - name: Apply version specifier (B2)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "automation_process/config_generator")
          from generate_npm_version_specifier import generate_npm_version_specifier

          B2  = "${{ inputs.B2 }}"
          package_json_path = "services/nodejs/package.json"
          generate_npm_version_specifier(B2, package_json_path)

          print(f"[generate_npm_version_specifier] modified {package_json_path}:")
          with open(package_json_path, "r") as f:
              print(f.read())
          PY


      # 5. Apply variable C1 (CI operation type), huge block
      # C1a: run without package-lock.json and without cache (done by cleanup step)
      - name: Apply CI pipeline operation (C1a - initial install) and run resolution command
        if: inputs.C1 == 'C1a'
        working-directory: services/nodejs
        continue-on-error: true
        run: |
          npm install --package-lock-only 2>&1 | tee "${{ inputs.cell_id }}_npm_log.txt" || true
      
      # C1b: package update situation: copy the fixed package-lock.json to the service directory
      # based on this package-lock.json to update the package from the configured registry in .npmrc (according to the cell)
      
      - name: Apply CI pipeline operation (C1b - package update) and run update command 
        if: inputs.C1 == 'C1b'
        working-directory: services/nodejs
        continue-on-error: true
        run: |
          cp "${{ github.workspace }}/fixed_setup_file/npm-service-fixed-lock.json" package-lock.json
          echo "[Apply C1b] copied fixed lockfile into npm service directory"
          npm update xueting-thesis-event-jianding xueting-thesis-service-fasong --package-lock-only 2>&1 | tee "${{ inputs.cell_id }}_npm_log.txt" || true

      # C1c: rebuild with lockfile: run install command before apply C1c to generate lockfile, 
      # then based on the generated package-lock.json to test C1c. if initial install cause resolution error -> no lockfile will generated
      # then skip running npm ci because it is not meaningful anymore 
      - name: Apply CI pipeline operation (C1c - rebuild with lockfile) and run update command 
        if: inputs.C1 == 'C1c'
        working-directory: services/nodejs
        continue-on-error: true
        run: |
          npm install --package-lock-only 2>&1 | tee "${{ inputs.cell_id }}_npm_setup_log.txt" || true
          if [ ! -f package-lock.json ]; then
            echo "[C1c] initial install failed: no lockfile generated. skip running npm ci." | tee "${{ inputs.cell_id }}_npm_log.txt"
            exit 0
          fi
          echo "[C1c] lockfile generated after initial install, now run npm ci for rebuild"
          npm ci --dry-run 2>&1 | tee "${{ inputs.cell_id }}_npm_log.txt" || true


      # 6. Run dependency resolution command
      # this step is implemented before the variable C1 step is implemented (stand: 11.07.2026)
      # here we should check the content of generated package-lock.json, it contains package name+version+resolved URL
      # IMPORTANT: the planned command "npm install --dry-run --json" only shows package name + version -> not optimal to use here
      # We save stdout of resolution command to a file and upload it together with package-lock.json,
      # because the result "resolution_error" should also be inspected
      
      # -------------------------------------------------------------------
      # - name: Run npm install --package-lock-only
      #   id: run_npm
      #   working-directory: services/nodejs
      #   # `continue-on-error: true` so a resolution error does not skip the artifact upload step below. 
      #   continue-on-error: true
      #   run: |
      #     npm install --package-lock-only 2>&1 | tee "${{ inputs.cell_id }}_npm_log.txt" || true
      # -------------------------------------------------------------------


      # 7. Upload the resolution output (package-lock.json + command output) and evidence files as one artifact. 
      # The central automated pipeline will download and classify it, and write one row to results.csv.
      - name: Upload raw resolution output of npm (package manager)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.cell_id }}_npm_raw
          path: |
            services/nodejs/.npmrc
            services/nodejs/package.json
            services/nodejs/package-lock.json
            services/nodejs/${{ inputs.cell_id }}_npm_log.txt
            services/nodejs/${{ inputs.cell_id }}_npm_setup_log.txt
          if-no-files-found: warn
          #changed from error to warn. because now some listed files (like the setup log for non-C1c cells) won't exist
          #choose "if-no-files-found: error" will fail the experiment cell (which does not involve C1c)