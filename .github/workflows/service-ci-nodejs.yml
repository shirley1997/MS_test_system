# Per-service CI pipeline for Node.js service. One run of this workflow = one experiment cell

# what will this workflow do:
  # execute one job: "run-cell", including 7 steps
#   1. Receives cell inputs from the central automated pipeline (or manually from the github UI when we manually trigger the workflow)
#   2. Generates the .npmrc file using the script: automation_process/config_generator/generate_npmrc.py
#   3. Runs resolution command inside services/nodejs/
#   4. Uploads the raw JSON output as an artifact for the central automated pipeline to download and make further classification



name: Service CI - Node.js

on:
  workflow_dispatch:
    inputs:
      cell_id:
        description: "Cell identifier, e.g. cell001, which is used in artifact (resolution output) filename."
        required: true
        type: string
      A:
        description: "Nexus repository type"
        required: true
        type: choice
        options: [A1a, A1b, A2, A3]
      B1:
        description: "package manager config"
        required: true
        type: choice
        options: [B1a, B1b, B1c, B1d]
      B2:
        description: "version specifier of the dependencies (only applied for internal packages)"
        required: true
        type: choice
        options: [B2a, B2b, B2c]
      C1:
        description: "CI operation type"
        required: true
        type: choice
        options: [C1a, C1b, C1c]
      run_sca:
        description: "sub-RQ2 probe: also run the SCA tool after dependency resolution"
        required: false
        type: choice
        default: "off"
        options: ["off", "on"]


jobs:
  run-cell:
    # use self-hosted github actions runner to execute the job 
    runs-on: [self-hosted, thesis-runner]

    steps:
      # 1. Get the repo to the runner.
      - name: Checkout repository
        uses: actions/checkout@v7

      
      #additional step: clean up (only for development phase)
      - name: Clean the filesystem before next cell run
        working-directory: services/nodejs
        run: |
          rm -f package-lock.json
          rm -f .npmrc
          rm -rf node_modules
          rm -f ${{ inputs.cell_id }}_*.txt ${{ inputs.cell_id }}_*.json
          npm cache clean --force
          echo "workspace cleaned"

      # 2. Echo the cell inputs so the workflow log records which cell ran.
      - name: Echo cell inputs
        run: |
          echo "cell_id = ${{ inputs.cell_id }}"
          echo "A       = ${{ inputs.A }}"
          echo "B1      = ${{ inputs.B1 }}"
          echo "B2      = ${{ inputs.B2 }}"
          echo "C1      = ${{ inputs.C1 }}"

      # 3. Generate .npmrc for this cell and write it into directory services/nodejs/
      #The generator prints .npmrc file content on stdout, or nothing if variable B1d
      - name: Generate .npmrc
        run: |
          python3 - <<'PY'
          import sys, os
          sys.path.insert(0, "automation_process/config_generator")
          from generate_npmrc import generate_npmrc

          A  = "${{ inputs.A }}"
          B1 = "${{ inputs.B1 }}"
          nexus_url = "http://host.docker.internal:8081"

          target = "services/nodejs/.npmrc"
          invalid_combi = "services/nodejs/${{ inputs.cell_id }}_invalid.txt"
          try:
            npmrc_content = generate_npmrc(A, B1, nexus_url)
            if npmrc_content is None:
                if os.path.exists(target):
                    os.remove(target)
                print(f"step [generate_npmrc] variable B1d: no .npmrc file is written in {target}.")
            else:
                with open(target, "w") as f:
                    f.write(npmrc_content)
                print(f"step [generate_npmrc] is already written into {target}:")
                print(npmrc_content)
          except ValueError as e:
            with open(invalid_combi, "w") as file:
              file.write(f"A={A}, B1={B1} -> {e}")
            print(f"step [generate_npmrc] this combination is invalid: {e}")
          PY

      # 4. apply B2 (version specifier): pinned / (close) ranged / unspecified
      # will directly edit services/nodejs/package.json to change the version specification of internal packages
      - name: Apply version specifier (B2)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "automation_process/config_generator")
          from generate_npm_version_specifier import generate_npm_version_specifier

          B2  = "${{ inputs.B2 }}"
          package_json_path = "services/nodejs/package.json"
          generate_npm_version_specifier(B2, package_json_path)

          print(f"[generate_npm_version_specifier] modified {package_json_path}:")
          with open(package_json_path, "r") as f:
              print(f.read())
          PY


      # 5. Apply variable C1 (CI operation type), huge block
      # C1a: run without package-lock.json and without cache (done by cleanup step)
      - name: Apply CI pipeline operation (C1a - initial install) and run resolution command
        if: inputs.C1 == 'C1a'
        working-directory: services/nodejs
        continue-on-error: true
        run: |
          if [ -f "${{ inputs.cell_id }}_invalid.txt" ]; then
            echo "skip: invalid A/B1 combination"
            exit 0
          fi

          npm install --package-lock-only 2>&1 | tee "${{ inputs.cell_id }}_npm_log.txt" || true
      
      # C1b: package update situation: copy the fixed package-lock.json to the service directory
      # based on this package-lock.json to update the package from the configured registry in .npmrc (according to the cell)
      # bug fixed 07.09: edge case: if update phase fail (e.g. because of the input configuration), the fixed lockfile is still there
      # and names "package-lock.json", it will be uploaded as artifact to GitHub, which will cause incorrect result classification
      # becuase this is lockfile from setup phase, not produced by update phase
      # solution: 
      #  1.copy fixed baseline file to npm service directory as "package-lock.json"
      # 2. then copy another portion named "Cell ID_setup-lock.json"
      # and if update phase fails, then remove the fixed baseline file "package-lock.json"
      # otherwise the central pipeline thinks the update phase is successful becuase it received package-lock.json (which is actually fixed baseline file)
      #  use set -o pipefail: let the exit code of the pipeline be npm's exit code, not tee's.
      # without using it, a pipeline reports the exit code of the LAST command (tee),
      # so a failed npm update looks successful and its setup phase lockfile is uploaded as evidence. (which is wrong!)
      # With pipefail the if-block below runs exactly when npm update itself fails,
      # e.g. ETARGET when the pinned version does not exist in this cell's configured registry.
      - name: Apply CI pipeline operation (C1b - package update) and run update command 
        if: inputs.C1 == 'C1b'
        working-directory: services/nodejs
        continue-on-error: true
        run: |
          if [ -f "${{ inputs.cell_id }}_invalid.txt" ]; then
            echo "skip: invalid A/B1 combination"
            exit 0
          fi

          cp "${{ github.workspace }}/fixed_setup_file/npm-service-fixed-lock.json" package-lock.json
          cp package-lock.json "${{ inputs.cell_id }}_setup-package-lock.json"
          echo "[Apply C1b] copied fixed lockfile into npm service directory"

                    
          set -o pipefail

          if ! npm update xueting-thesis-event-jianding xueting-thesis-service-fasong --package-lock-only \
               2>&1 | tee "${{ inputs.cell_id }}_npm_log.txt"; then
            echo "[C1b] update phase failed. removed the carried-over setup lockfile."
            rm -f package-lock.json
          fi

      # C1c: rebuild with lockfile: run install command before apply C1c to generate lockfile, 
      # then based on the generated package-lock.json to test C1c. if initial install cause resolution error -> no lockfile will generated
      # then skip running npm ci because it is not meaningful anymore 
      # if phase 1 success: keep the phase-1 lockfile under its own name, so it stays inspectable even if the
      # rebuild phase fails and package-lock.json has to be removed
      # if phase 2 failed, so this cell doesn't have file for valid observation of the C1c scenario. 
      # remove package-lock.json so the central pipeline
      # finds no evidence and classifies resolution_error
      - name: Apply CI pipeline operation (C1c - rebuild with lockfile) and run update command 
        if: inputs.C1 == 'C1c'
        working-directory: services/nodejs
        continue-on-error: true
        run: |
          if [ -f "${{ inputs.cell_id }}_invalid.txt" ]; then
            echo "skip: invalid A/B1 combination"
            exit 0
          fi

          npm install --package-lock-only 2>&1 | tee "${{ inputs.cell_id }}_npm_setup_log.txt" || true
          if [ ! -f package-lock.json ]; then
            echo "[C1c] initial install failed: no lockfile generated. skip running npm ci." | tee "${{ inputs.cell_id }}_npm_log.txt"
            exit 0
          fi


          cp package-lock.json "${{ inputs.cell_id }}_setup-package-lock.json"

          echo "[C1c] lockfile generated after initial install, now run npm ci for rebuild"

          set -o pipefail
          if ! npm ci --dry-run 2>&1 | tee "${{ inputs.cell_id }}_npm_log.txt"; then

            echo "[C1c] rebuild phase (npm ci) failed. removed package-lock.json; phase 1 lockfile kept as _setup-package-lock.json." \
              | tee -a "${{ inputs.cell_id }}_npm_log.txt"
            rm -f package-lock.json
          fi


      # 6. Run dependency resolution command
      # this step is implemented before the variable C1 step is implemented (stand: 11.07.2026)
      # here we should check the content of generated package-lock.json, it contains package name+version+resolved URL
      # IMPORTANT: the planned command "npm install --dry-run --json" only shows package name + version -> not optimal to use here
      # We save stdout of resolution command to a file and upload it together with package-lock.json,
      # because the result "resolution_error" should also be inspected
  
      
      # - name: Run npm install --package-lock-only
      #   id: run_npm
      #   working-directory: services/nodejs
      #   # `continue-on-error: true` so a resolution error does not skip the artifact upload step below. 
      #   continue-on-error: true
      #   run: |
      #     npm install --package-lock-only 2>&1 | tee "${{ inputs.cell_id }}_npm_log.txt" || true
      


      # sub-RQ2 test round: run Trivy against this cell's files.
      # the switch input run_sca is turned on, so this step can be run or not run.
      # Three scans per cell:
      #   1. declared only  + json       -> the SCA report that would be classified
      #   2. declared only  + cyclonedx  -> the output format that can carry an origin URL
      #   3. everything     + json       -> what changes when installed packages are visible
      # Scan 2 is SBOM-only, so it needs no vulnerability database.
      # Exit codes are captured using PIPESTATUS.

      # trivy_write_file is the filename prefix for everything Trivy writes (e.g. pip_A1a_..._trivy). 
      # SKIP is the list of folders that Trivy should ignore: the directory holding installed packages (py_dependency) rather than declared ones.

      # use trivy fs . to scan the whole directory, use vuln scanner
      # use tee -a  to append the command output to the log file.
      - name: Run Trivy (SCA Tool)
        if: inputs.run_sca == 'on'
        working-directory: services/nodejs
        continue-on-error: true
        run: |
          trivy_write_file="${{ inputs.cell_id }}_trivy"
          SKIP="--skip-dirs node_modules"

          trivy version --format json | tee "${trivy_write_file}_version.json"


          echo "scan 1: declared only, json" | tee "${trivy_write_file}_log.txt"
          trivy fs . $SKIP --scanners vuln --list-all-pkgs --no-progress --skip-db-update \
            --format json --output "${trivy_write_file}_declared.json" \
            2>&1 | tee -a "${trivy_write_file}_log.txt"
          echo "scan 1 trivy exit code: ${PIPESTATUS[0]}" | tee -a "${trivy_write_file}_log.txt"

          echo "scan 2: declared only, cyclonedx" | tee -a "${trivy_write_file}_log.txt"
          trivy fs . $SKIP --scanners vuln --no-progress --skip-db-update \
            --format cyclonedx --output "${trivy_write_file}_declared_cdx.json" \
            2>&1 | tee -a "${trivy_write_file}_log.txt"
          echo "scan 2 trivy exit code: ${PIPESTATUS[0]}" | tee -a "${trivy_write_file}_log.txt"

          echo "scan 3: everything, json" | tee -a "${trivy_write_file}_log.txt"
          trivy fs . --scanners vuln --list-all-pkgs --no-progress --skip-db-update \
            --format json --output "${trivy_write_file}_all.json" \
            2>&1 | tee -a "${trivy_write_file}_log.txt"
          echo "scan 3 trivy exit code: ${PIPESTATUS[0]}" | tee -a "${trivy_write_file}_log.txt"

          ls -l ${trivy_write_file}_* | tee -a "${trivy_write_file}_log.txt"

      # the step of run DepGate scan
      # use 2 analysis mode (the output will be compared): compare, heuristics
      - name: Run DepGate (SCA Tool)
        if: inputs.run_sca == 'on'
        working-directory: services/nodejs
        continue-on-error: true
        run: |
          depgate_write_file="${{ inputs.cell_id }}_depgate"
          
          /opt/depgate/bin/pip show depgate | tee "${depgate_write_file}_versions.txt"


          echo "depgate scan 1: analysis level - compare" | tee "${depgate_write_file}_log.txt"
          depgate scan -t npm -d . -a compare \
            -o "${depgate_write_file}_compare.json" --loglevel DEBUG \
            2>&1 | tee -a "${depgate_write_file}_log.txt"
          echo "depgate scan 1 exit code: ${PIPESTATUS[0]}" | tee -a "${depgate_write_file}_log.txt"

          echo "depgate scan 2: analysis level - heuristics" | tee -a "${depgate_write_file}_log.txt"
          depgate scan -t npm -d . -a heur --error-on-warnings \
            -o "${depgate_write_file}_heuri.json" --loglevel DEBUG \
            2>&1 | tee -a "${depgate_write_file}_log.txt"
          echo "depgate scan 2 exit code: ${PIPESTATUS[0]}" | tee -a "${depgate_write_file}_log.txt"


          echo "depgate scan 3: heuristics, check direct dependencies only" | tee -a "${depgate_write_file}_log.txt"
          depgate scan -t npm -d . -a heur --error-on-warnings --direct-only \
            -o "${depgate_write_file}_heur_direct.json" --loglevel DEBUG \
            2>&1 | tee -a "${depgate_write_file}_log.txt"
          echo "depgate scan 3 exit code: ${PIPESTATUS[0]}" | tee -a "${depgate_write_file}_log.txt"


          ls -l ${depgate_write_file}_* | tee -a "${depgate_write_file}_log.txt"

      # DepCheck: takes the package names read from manifest / lofkcile, then checks the public registry 
      # scan 1 = check package.json (declared dependencies), scan 2 = check package-lock.json (resolved dependencies)
      - name: Run DepCheck (SCA Tool)
        if: inputs.run_sca == 'on'
        working-directory: services/nodejs
        continue-on-error: true
        run: |
          depcheck_write_file="${{ inputs.cell_id }}_depcheck"

          python3.12 -I /opt/depcheck/depcheck.py --version | tee "${depcheck_write_file}_version.txt"

          echo "scan 1: package.json" | tee "${depcheck_write_file}_log.txt"
          python3.12 -I /opt/depcheck/depcheck.py package.json --no-banner \
            --export "${depcheck_write_file}.json" \
            2>&1 | tee -a "${depcheck_write_file}_log.txt"
          echo "scan 1 exit code: ${PIPESTATUS[0]}" | tee -a "${depcheck_write_file}_log.txt"

          # package-lock.json does not exist in cells where the resolution failed
          if [ -f package-lock.json ]; then
            echo "scan 2: package-lock.json" | tee -a "${depcheck_write_file}_log.txt"
            python3.12 -I /opt/depcheck/depcheck.py package-lock.json --no-banner \
              --export "${depcheck_write_file}_lock.json" \
              2>&1 | tee -a "${depcheck_write_file}_log.txt"
            echo "scan 2 exit code: ${PIPESTATUS[0]}" | tee -a "${depcheck_write_file}_log.txt"
          fi

          # positive control: create a fake package.json with a package name that does not exist on npm
          mkdir -p /tmp/depcheck_control
          cat > /tmp/depcheck_control/package.json <<'EOF'
          {"name": "control", "version": "1.0.0", "dependencies": {"xueting-thesis-not-published": "1.0.0"}}
          EOF
          echo "positive control:" | tee -a "${depcheck_write_file}_log.txt"
          python3.12 -I /opt/depcheck/depcheck.py /tmp/depcheck_control/package.json --no-banner \
            --export "${depcheck_write_file}_positive_control.json" \
            2>&1 | tee -a "${depcheck_write_file}_log.txt"
          echo "positive control exit code: ${PIPESTATUS[0]}" | tee -a "${depcheck_write_file}_log.txt"



      # 7. Upload the resolution output (package-lock.json + command output) and evidence files as one artifact. 
      # The central automated pipeline will download and classify it, and write one row to results.csv.
      - name: Upload raw resolution output of npm (package manager)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.cell_id }}_npm_raw
          path: |
            services/nodejs/.npmrc
            services/nodejs/package.json
            services/nodejs/package-lock.json
            services/nodejs/${{ inputs.cell_id }}_setup-package-lock.json
            services/nodejs/${{ inputs.cell_id }}_npm_log.txt
            services/nodejs/${{ inputs.cell_id }}_npm_setup_log.txt
            services/nodejs/${{ inputs.cell_id }}_invalid.txt


            services/nodejs/${{ inputs.cell_id }}_trivy_version.json
            services/nodejs/${{ inputs.cell_id }}_trivy_log.txt
            services/nodejs/${{ inputs.cell_id }}_trivy_declared.json
            services/nodejs/${{ inputs.cell_id }}_trivy_declared_cdx.json
            services/nodejs/${{ inputs.cell_id }}_trivy_all.json

            services/nodejs/${{ inputs.cell_id }}_depgate_versions.txt
            services/nodejs/${{ inputs.cell_id }}_depgate_log.txt
            services/nodejs/${{ inputs.cell_id }}_depgate_compare.json
            services/nodejs/${{ inputs.cell_id }}_depgate_heuri.json
            services/nodejs/${{ inputs.cell_id }}_depgate_heur_direct.json

            services/nodejs/${{ inputs.cell_id }}_depcheck_version.txt
            services/nodejs/${{ inputs.cell_id }}_depcheck_log.txt
            services/nodejs/${{ inputs.cell_id }}_depcheck.json
            services/nodejs/${{ inputs.cell_id }}_depcheck_lock.json
            services/nodejs/${{ inputs.cell_id }}_depcheck_positive_control.json


          if-no-files-found: warn
          #changed from error to warn. because now some listed files (like the setup log for non-C1c cells) won't exist
          #choose "if-no-files-found: error" will fail the experiment cell (which does not involve C1c)